[package]
name = "hopwhy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Bounded causal DNS-to-HTTP diagnostics for humans and agents"
license = "MIT"
repository = "https://github.com/yhay81/hopwhy"
homepage = "https://github.com/yhay81/hopwhy"
readme = "README.md"
keywords = ["cli", "diagnostics", "http", "networking", "dns"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/**", "tests/**", "docs/**", "CONCEPT.md", "ROADMAP.md"]

[dependencies]
base64 = "=0.23.0"
clap = { version = "=4.6.4", features = ["derive"] }
clap_complete = "=4.5.54"
humantime = "=2.2.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "http2", "rustls-no-provider"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "=0.8.22", features = ["derive"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
url = { version = "=2.5.4", features = ["serde"] }
webpki-roots = "=1.0.9"

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
tempfile = "=3.19.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
