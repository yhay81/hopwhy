name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: v1 evidence gate tests
        run: |
          python3 -m unittest discover \
            -s scripts/tests -p 'test_verify_v1_evidence.py'
          python3 scripts/verify_v1_evidence.py \
            .github/v1-evidence.json --check-structure
      - name: Report compatibility corpus
        shell: bash
        run: |
          jq -e . tests/fixtures/contracts/v0.1/manifest.json >/dev/null
          jq -e . tests/fixtures/contracts/v0.1/dns-failure.report.json >/dev/null
      - name: Benchmark harness smoke
        shell: bash
        run: |
          bash -n benchmarks/run.sh
          python3 benchmarks/http_fixture.py --help >/dev/null
      - name: Machine contracts and completions
        shell: bash
        run: |
          cargo build --locked
          for document in brief spec report plan compare replay capabilities error; do
            target/debug/hopwhy --format json schema --document "${document}" \
              | jq -e . >/dev/null
          done
          for shell in bash zsh fish powershell elvish; do
            test -n "$(target/debug/hopwhy completions "${shell}")"
          done
      - name: Documentation links
        shell: bash
        run: |
          for file in README.md CONCEPT.md ROADMAP.md CHANGELOG.md RELEASING.md \
              SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md \
              SUPPORT.md ADOPTERS.md docs/*.md; do
            test -s "${file}"
          done
          while IFS= read -r file; do
            while IFS= read -r link; do
              target="${link%%#*}"
              test -z "${target}" || test -e "$(dirname "${file}")/${target}"
            done < <(
              grep -oE '\]\([A-Za-z0-9_./-]+\.md(#[^)]+)?\)' "${file}" \
                | sed -E 's/^\]\(([^)#]+)(#[^)]+)?\)$/\1/' \
                | sort -u
            )
          done < <(find . -name '*.md' -not -path './target/*' -print)

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 \
            --locked --no-default-features
      - name: Audit Rust dependencies
        run: cargo +1.88.0 audit --deny warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test library and CLI
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked

  fixture-stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Repeat bounded network fixtures
        shell: bash
        run: |
          for iteration in $(seq 1 10); do
            cargo test --test cli --locked --quiet
            printf 'fixture iteration %s/10 passed\n' "${iteration}"
          done
