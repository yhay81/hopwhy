name: Adoption report
description: Share a sanitized HopWhy evaluation or repeat-use report
title: "[Adoption]: "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping HopWhy measure real-world usefulness before v1.0.
        This issue is public. Do not include production targets, private
        addresses, credentials, certificates, or unredacted reports.
  - type: input
    id: version
    attributes:
      label: HopWhy version
      description: Prefer the exact output of `hopwhy --version`.
      placeholder: hopwhy 0.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture, and sanitized network context.
      placeholder: macOS 15 arm64; public HTTPS target
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Sanitized workflow
      description: What diagnostic job was run, and was the earliest failed phase useful and accurate?
    validations:
      required: true
  - type: dropdown
    id: repeat_use
    attributes:
      label: Usage duration
      options:
        - Evaluation only
        - Repeated use for less than 30 days
        - Repeated use for at least 30 days
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision improved
      description: What remediation, escalation, or safe non-action did the report improve?
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations or failures
      description: Include false causes, missed phases, unsafe recommendations, or ambiguity. Write "None observed" if applicable.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Public evidence
      description: Optional link to a public integration, workflow, or sanitized result.
  - type: dropdown
    id: listing_permission
    attributes:
      label: Listing permission
      description: May maintainers summarize this report in ADOPTERS.md or release notes?
      options:
        - Yes, with the public name given here
        - Yes, only as anonymized or aggregate evidence
        - No, feedback only
    validations:
      required: true
  - type: checkboxes
    id: public_safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I reviewed this report and removed secrets, confidential data, private targets, and unsafe artifacts.
          required: true
