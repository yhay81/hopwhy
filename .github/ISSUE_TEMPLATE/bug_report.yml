name: Bug report
description: Report reproducible incorrect, unsafe, or unstable behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, unredacted internal targets, or vulnerabilities. Use private security reporting for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: HopWhy version
      placeholder: hopwhy 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64, Ubuntu 24.04 x86_64, Windows 11 x86_64
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the earliest failed phase and a sanitized result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer a local deterministic fixture and include bounded options.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and reviewed all expanded-disclosure options.
          required: true
